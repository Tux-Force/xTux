# cargo-deny: licenses, security advisories and sources of all dependencies.
# Run `cargo deny check`; the CI runs it on every pull request.

[graph]
all-features = false

[advisories]
# Known vulnerabilities (RustSec). Unmaintained crates are reported but do not fail the check.
unmaintained = "none"
ignore = []

[licenses]
# xTux is GPL-3.0; only licenses that can be combined with it are allowed.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/tuxuser/eappx-rs",
    "https://github.com/xodus-gaming/ntfs.git",
    "https://github.com/xodus-gaming/xal-rs",
]
