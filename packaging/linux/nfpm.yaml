# Native Linux packages of xTux (.deb, .rpm, Arch .pkg.tar.zst), built with nfpm (https://nfpm.goreleaser.com)
# from the CI-built binaries. Do not run nfpm on this file directly: packaging/linux/build-packages.sh stages the
# binaries, desktop file, icon and licenses next to a copy of it and builds all three formats.
#
# Layout: the binaries live together in /usr/lib/xtux, because the clients start xtux-service (and the service
# starts xtux-cli for the sign-in) from the directory of the running program; /usr/bin holds symlinks to them.
# Wine is not a dependency: xTux downloads the Tux-Force Wine build into its data folder during the setup.
name: xtux
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: games
priority: optional
maintainer: Tux-Force <https://github.com/Tux-Force/xTux/issues>
vendor: Tux-Force
homepage: https://tux-force.github.io
license: GPL-3.0-only
description: |-
  Play your Xbox PC games on Linux.
  xTux signs you in with your Microsoft account, installs the PC games you own or play with PC Game Pass and
  starts them with the Tux-Force Wine build. It ships the xTux Launcher (xtux-launcher), the command line tool
  (xtux-cli) and the daemon both talk to (xtux-service). Unofficial community project, not affiliated with
  Microsoft or Xbox.

contents:
  - src: xtux-launcher
    dst: /usr/lib/xtux/xtux-launcher
    file_info: { mode: 0755 }
  - src: xtux-cli
    dst: /usr/lib/xtux/xtux-cli
    file_info: { mode: 0755 }
  - src: xtux-service
    dst: /usr/lib/xtux/xtux-service
    file_info: { mode: 0755 }
  - src: /usr/lib/xtux/xtux-launcher
    dst: /usr/bin/xtux-launcher
    type: symlink
  - src: /usr/lib/xtux/xtux-cli
    dst: /usr/bin/xtux-cli
    type: symlink
  - src: /usr/lib/xtux/xtux-service
    dst: /usr/bin/xtux-service
    type: symlink
  - src: io.github.tux_force.xTux.desktop
    dst: /usr/share/applications/io.github.tux_force.xTux.desktop
    file_info: { mode: 0644 }
  - src: io.github.tux_force.xTux.metainfo.xml
    dst: /usr/share/metainfo/io.github.tux_force.xTux.metainfo.xml
    file_info: { mode: 0644 }
  - src: io.github.tux_force.xTux.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.tux_force.xTux.png
    file_info: { mode: 0644 }
  # Debian keeps the license in /usr/share/doc/<package>/copyright, Fedora, openSUSE and Arch in /usr/share/licenses.
  - src: LICENSE
    dst: /usr/share/doc/xtux/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: THIRD-PARTY-LICENSES.md
    dst: /usr/share/doc/xtux/THIRD-PARTY-LICENSES.md
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/xtux/LICENSE
    packager: rpm
    type: license
    file_info: { mode: 0644 }
  - src: THIRD-PARTY-LICENSES.md
    dst: /usr/share/licenses/xtux/THIRD-PARTY-LICENSES.md
    packager: rpm
    type: license
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/xtux/LICENSE
    packager: archlinux
    file_info: { mode: 0644 }
  - src: THIRD-PARTY-LICENSES.md
    dst: /usr/share/licenses/xtux/THIRD-PARTY-LICENSES.md
    packager: archlinux
    file_info: { mode: 0644 }

# Runtime libraries. Linked: glibc, OpenSSL 3, D-Bus (keyring), fontconfig and, for the Microsoft sign-in window
# of xtux-cli, WebKitGTK 4.1. Loaded at run time by the launcher (Slint on winit with the femtovg/OpenGL
# renderer): xkbcommon, Wayland, X11 and EGL/OpenGL. tar, xz and zstd unpack Wine and the runtime downloads.
# The binaries need glibc 2.39 or newer (built on Ubuntu 24.04).
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libssl3t64 | libssl3
      - libdbus-1-3
      - libfontconfig1
      - libwebkit2gtk-4.1-0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libegl1
      - libgl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - tar
      - xz-utils
      - zstd
    recommends:
      - libvulkan1
      - mesa-vulkan-drivers
  # Soname requirements work on Fedora and openSUSE alike, whose package names differ.
  rpm:
    depends:
      - libc.so.6(GLIBC_2.39)(64bit)
      - libgcc_s.so.1()(64bit)
      - libssl.so.3()(64bit)
      - libcrypto.so.3()(64bit)
      - libdbus-1.so.3()(64bit)
      - libfontconfig.so.1()(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - /usr/bin/tar
      - /usr/bin/xz
      - /usr/bin/zstd
    recommends:
      - libvulkan.so.1()(64bit)
  archlinux:
    depends:
      - glibc
      - gcc-libs
      # Arch's openssl is 4.x; the 3.x libraries come from openssl-3, which provides these sonames.
      - libssl.so=3-64
      - libcrypto.so=3-64
      - dbus
      - fontconfig
      - webkit2gtk-4.1
      - libxkbcommon
      - libxkbcommon-x11
      - wayland
      - libglvnd
      - libx11
      - libxcursor
      - libxi
      - libxrandr
      - tar
      - xz
      - zstd
    recommends:
      - "vulkan-icd-loader: Vulkan for DXVK/VKD3D in games"

rpm:
  group: Amusements/Games
  summary: Play your Xbox PC games on Linux
  compression: zstd

deb:
  compression: xz

archlinux:
  packager: Tux-Force <https://github.com/Tux-Force/xTux/issues>
