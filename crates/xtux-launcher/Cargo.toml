[package]
name = "xtux-launcher"
version = "0.1.0"
edition = "2024"
description = "xTux Launcher: library, sign-in and game start for Tux-Force, a client of xtux-service."
license = "GPL-3.0-or-later"

[dependencies]
xtux-protocol = { path = "../xtux-protocol" }
xtux-games = { path = "../xtux-games" }
tokio = { workspace = true }
rustix = { version = "1.1.4", features = ["fs"] }
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "1.18"
