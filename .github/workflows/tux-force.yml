# Tux-Force (xTux) CI: build the workspace on Linux x86_64, run the tests
# and publish xtux-cli and xtux-service as downloadable artifacts.
# Pushes to main also create a GitHub release v<version of xtux-cli> once.
# The licenses job checks the licenses and sources of all dependencies
# (cargo-deny, deny.toml) and that licenses/THIRD-PARTY-LICENSES.md is current.
#
# The upstream "Rust check" workflow (rust.yml) is left untouched; it only
# runs on pushes to main and on pull requests (clippy + tests).

name: Tux-Force build

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Licenses must be GPL-3.0 compatible, git sources known (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans

      # Known vulnerabilities are reported but do not block yet: several sit deep in upstream crates and need
      # dependency upgrades of their own.
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli

      - name: Third-party license list is up to date
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code -- licenses/THIRD-PARTY-LICENSES.md || {
            echo "licenses/THIRD-PARTY-LICENSES.md is out of date: run scripts/third-party-licenses.sh and commit it."
            exit 1
          }

  build:
    name: Build and test (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # protobuf-compiler: prost-build in crates/xodus compiles proto/
      # libwebkit2gtk-4.1-dev: wry/tao login webview (pulls in gtk3 + libsoup3)
      # libdbus-1-dev: keyring (dbus-secret-service)
      # libssl-dev: openssl-sys
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            protobuf-compiler \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libssl-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      # The workspace requires a recent stable Rust (rust-version in Cargo.toml).
      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tux-force-${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tux-force-${{ runner.os }}-release-

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/xtux-cli target/release/xtux-service target/release/xtux-launcher dist/
          cp LICENSE licenses/THIRD-PARTY-LICENSES.md dist/
          strip dist/xtux-cli dist/xtux-service dist/xtux-launcher
          (cd dist && sha256sum xtux-cli xtux-service xtux-launcher > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: xtux-linux-x86_64
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: [build, licenses]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: xtux-linux-x86_64
          path: dist

      - name: Create the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/xtux-cli/Cargo.toml | head -1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already; bump the version in crates/xtux-cli/Cargo.toml for a new one."
            exit 0
          fi
          chmod +x dist/xtux-cli dist/xtux-service dist/xtux-launcher
          archive="xtux-$version-linux-x86_64.tar.gz"
          tar -C dist -czf "$archive" xtux-cli xtux-service xtux-launcher SHA256SUMS LICENSE THIRD-PARTY-LICENSES.md
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$tag" "$archive" "$archive.sha256" \
            --target "$GITHUB_SHA" --title "xTux $version" --generate-notes
