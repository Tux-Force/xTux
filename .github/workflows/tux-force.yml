# Tux-Force (xTux) CI: build the workspace on Linux x86_64, run the tests
# and publish xodus-cli and xodus-service as downloadable artifacts.
#
# The upstream "Rust check" workflow (rust.yml) is left untouched; it only
# runs on pushes to main and on pull requests (clippy + tests).

name: Tux-Force build

on:
  push:
    branches: [tux-force]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # protobuf-compiler: prost-build in crates/xodus compiles proto/
      # libwebkit2gtk-4.1-dev: wry/tao login webview (pulls in gtk3 + libsoup3)
      # libdbus-1-dev: keyring (dbus-secret-service)
      # libssl-dev: openssl-sys
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            protobuf-compiler \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libssl-dev

      # The workspace requires a recent stable Rust (rust-version in Cargo.toml).
      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tux-force-${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tux-force-${{ runner.os }}-release-

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/xodus-cli target/release/xodus-service dist/
          strip dist/xodus-cli dist/xodus-service
          (cd dist && sha256sum xodus-cli xodus-service > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: xtux-linux-x86_64
          path: dist/
          if-no-files-found: error
